[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cctrail"
version = "0.1.0"
description = "Index, search, and browse your Claude Code session history from the terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nikos" }]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.50"]

[project.scripts]
cctrail = "cctrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
